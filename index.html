<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kavach - Security Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf1;--p:#fff;--ink:#12202c;--mut:#566673;--ln:#cbd6de;--acc:#2438d8;--on:#fff;--ok:#14785a;--warn:#9a6200;--bad:#c1232b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--p:#17212a;--ink:#e6edf2;--mut:#8fa1ae;--ln:#2a3844;--acc:#8c9dff;--on:#0f161c;--ok:#4cc9a0;--warn:#e0a93b;--bad:#ff7b7f}}
:root[data-theme="dark"]{--bg:#0f161c;--p:#17212a;--ink:#e6edf2;--mut:#8fa1ae;--ln:#2a3844;--acc:#8c9dff;--on:#0f161c;--ok:#4cc9a0;--warn:#e0a93b;--bad:#ff7b7f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
header{padding:28px clamp(16px,4vw,48px) 6px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;max-width:1148px}
h1{font:800 clamp(36px,6vw,58px)/1 'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--mut);max-width:48ch}
.go{background:var(--acc);color:var(--on);border:0;padding:11px 20px;border-radius:10px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding:16px clamp(16px,4vw,48px) 48px;max-width:1148px}
nav{display:flex;flex-direction:column;gap:2px}
.nv{all:unset;cursor:pointer;padding:9px 12px;border-left:3px solid transparent;border-radius:0 8px 8px 0}
.nv:hover{background:var(--p)}.nv.on{border-color:var(--acc);background:var(--p)}.nv:focus-visible{outline:2px solid var(--acc)}
.nv b{display:block;font-weight:600}.nv small{color:var(--mut)}
#main{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:22px;align-self:start;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
h2{font:600 26px 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.d{color:var(--mut);margin:2px 0 12px}
label{display:block;font-weight:600;margin:12px 0 4px}
.ck{display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:10px 16px 0 0}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:14px ui-monospace,Menlo,Consolas,monospace}
input[type=checkbox]{width:auto}input:focus-visible,textarea:focus-visible,select:focus-visible,.b:focus-visible,.go:focus-visible{outline:2px solid var(--acc)}
.b{background:transparent;border:1px solid var(--ln);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;margin:10px 6px 0 0}
.b:hover{border-color:var(--acc)}
.row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}
.row i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--mut)}
.row.ok i{background:var(--ok)}.row.warn i{background:var(--warn)}.row.bad i{background:var(--bad)}
.big{font:600 24px 'Bricolage Grotesque',system-ui,sans-serif;margin:14px 0 4px}.big small{font:400 14px 'Instrument Sans',sans-serif;color:var(--mut);margin-left:6px}
.big.ok{color:var(--ok)}.big.warn{color:var(--warn)}.big.bad{color:var(--bad)}
.meter{height:8px;background:var(--bg);border-radius:4px;margin:12px 0;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--mut);transition:width .25s}.meter b.ok{background:var(--ok)}.meter b.warn{background:var(--warn)}.meter b.bad{background:var(--bad)}
.kv{margin:8px 0}.kv span{font-weight:600;margin-right:8px}code{word-break:break-all;font:13px ui-monospace,Menlo,Consolas,monospace}
code.code{font-size:34px;font-weight:700;letter-spacing:.08em}
.two{max-width:360px}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;overflow-x:auto}.nv{flex:none;border-left:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}.nv small{display:none}.nv.on{border-color:var(--acc)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div><h1>Kavach</h1><p>Ten security tools in one page. Everything runs in your browser; nothing you type is sent anywhere.</p></div><button class="go" id="demo">Run demo</button></header>
<div class="wrap"><nav id="nav" aria-label="Tools"></nav><section id="main"></section></div>
<script>
const $=(s,r=document)=>r.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=new TextEncoder(),dec=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const R=(l,t)=>`<div class="row ${l}"><i></i><span>${esc(t)}</span></div>`;
const TM=s=>s<1?'instantly':s<60?Math.round(s)+' seconds':s<3600?Math.round(s/60)+' minutes':s<86400?Math.round(s/3600)+' hours':s<3.15e7?Math.round(s/86400)+' days':s<3.15e9?Math.round(s/3.15e7)+' years':'centuries or more';
const rnd=n=>{const a=new Uint32Array(1),m=Math.floor(2**32/n)*n;do crypto.getRandomValues(a);while(a[0]>=m);return a[0]%n};
let timer,demoOn=false;

function strength(p){let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^a-zA-Z0-9]/.test(p))pool+=33;
let bits=p.length*Math.log2(pool||1);const tips=[],low=p.toLowerCase();
const hit=['password','qwerty','123456','admin','welcome','letmein','iloveyou','abc123','india','summer','monkey','dragon'].filter(w=>low.includes(w));
if(hit.length){bits-=20;tips.push(['bad','Contains a common word: '+hit.join(', ')])}
if(/(.)\1{2,}/.test(p)){bits-=8;tips.push(['warn','Repeated characters'])}
if(/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer)/i.test(p)){bits-=10;tips.push(['warn','Easy sequence like 1234 or abcd'])}
if(p.length<12)tips.push(['warn','Use 12 or more characters']);
if(!/[A-Z]/.test(p)||!/[a-z]/.test(p)||!/\d/.test(p)||!/[^a-zA-Z0-9]/.test(p))tips.push(['warn','Mix upper, lower, digits and symbols']);
if(!tips.length)tips.push(['ok','No common patterns found']);
bits=Math.max(0,bits);const [l,c]=bits<28?['Very weak','bad']:bits<40?['Weak','bad']:bits<60?['Fair','warn']:bits<80?['Strong','ok']:['Excellent','ok'];
return{bits,l,c,tips,sec:2**bits/1e10}}

function phish(u){let url;try{url=new URL(/^[a-z]+:\/\//i.test(u)?u:'http://'+u)}catch{return{v:'Not a valid URL',c:'bad',html:''}}
const h=url.hostname.toLowerCase(),parts=h.split('.'),out=[];let s=0;const add=(l,t,p)=>{out.push(R(l,t));s+=p};
if(url.protocol!=='https:')add('warn','No HTTPS, so traffic is not encrypted',15);
if(/^\d+\.\d+\.\d+\.\d+$/.test(h))add('bad','Host is a raw IP address',30);
if(u.includes('@'))add('bad','Contains "@", which can hide the real destination',25);
if(h.includes('xn--'))add('bad','Punycode domain, may imitate other characters',25);
if(parts.length>4)add('warn',(parts.length-2)+' subdomains deep',15);
if((h.match(/-/g)||[]).length>=2)add('warn','Many hyphens in the domain',10);
if(/\.(tk|ml|ga|cf|gq|xyz|top|click|zip|work|support)$/.test(h))add('warn','Free or high-abuse domain ending',15);
if(/^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|rb\.gy)$/.test(h))add('warn','URL shortener hides the destination',15);
const f=['login','verify','secure','update','account','kyc','upi','bank','wallet','otp','refund','prize','free'].filter(k=>(h+url.pathname).includes(k));
if(f.length)add('warn','Credential or pressure words: '+f.join(', '),10+5*f.length);
const reg=parts.slice(-2).join('.'),b=['paypal','google','amazon','paytm','phonepe','sbi','hdfc','icici','apple','microsoft','netflix','facebook','instagram','whatsapp'].find(b=>h.includes(b)&&!reg.startsWith(b+'.'));
if(b)add('bad',`Mentions "${b}" but the real domain is ${reg}`,35);
if(u.length>75)add('warn','Very long URL',10);
if(!out.length)out.push(R('ok','No common phishing signs found'));
const[v,c]=s>=50?['High risk','bad']:s>=25?['Suspicious','warn']:['Looks low risk','ok'];return{v,c,html:out.join('')}}

const b32=s=>{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const ch of s.toUpperCase().replace(/[^A-Z2-7]/g,''))bits+=A.indexOf(ch).toString(2).padStart(5,'0');return Uint8Array.from(bits.match(/.{8}/g)||[],x=>parseInt(x,2))};
async function totp(sec){const k=await crypto.subtle.importKey('raw',b32(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']);const buf=new ArrayBuffer(8);new DataView(buf).setUint32(4,Math.floor(Date.now()/30000));
const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}

const jd=s=>JSON.parse(dec.decode(unb64(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const ju=o=>b64(enc.encode(JSON.stringify(o))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');

function mail(t){t=t.replace(/\r?\n[ \t]+/g,' ');const g=n=>(t.match(new RegExp('^'+n+':\\s*(.*)$','mi'))||[])[1]||'',dm=s=>((s.match(/@([\w.-]+)/)||[])[1]||'').toLowerCase(),out=[],ar=g('Authentication-Results');
['spf','dkim','dmarc'].forEach(k=>{const m=ar.match(new RegExp(k+'=(\\w+)','i')),v=m?m[1].toLowerCase():'missing';out.push(R(v==='pass'?'ok':(v==='missing'||v==='none')?'warn':'bad',k.toUpperCase()+': '+v))});
const f=dm(g('From')),rp=dm(g('Return-Path')),rt=dm(g('Reply-To'));
if(f&&rp&&f!==rp)out.push(R('bad',`From domain (${f}) differs from Return-Path (${rp})`));
if(f&&rt&&f!==rt)out.push(R('bad',`Replies go to ${rt}, not ${f}`));
if(/urgent|verify|suspend|kyc|immediately|expire/i.test(g('Subject')))out.push(R('warn','Subject uses urgency or pressure wording'));
const hops=[...t.matchAll(/^Received:\s*(.*)$/gim)].map(x=>x[1]);out.push(R('info',hops.length+' mail hops (newest first)'));
hops.slice(0,4).forEach(x=>out.push(`<div class="kv"><code>${esc(x.slice(0,140))}</code></div>`));return out.join('')}

const need=[['content-security-policy',25],['strict-transport-security',20],['x-content-type-options',10],['x-frame-options',15],['referrer-policy',10],['permissions-policy',10],['cross-origin-opener-policy',10]];
function heads(t){const m={};t.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i>0)m[l.slice(0,i).trim().toLowerCase()]=l.slice(i+1).trim()});let s=0;const out=[];
need.forEach(([k,w])=>{let v=m[k];if(k==='x-frame-options'&&!v&&/frame-ancestors/.test(m['content-security-policy']||''))v='csp';
if(!v){out.push(R('bad','Missing '+k));return}
if(k==='content-security-policy'&&/unsafe-inline|unsafe-eval/.test(v)){s+=w*.6;out.push(R('warn',k+' allows unsafe-inline or unsafe-eval'));return}
if(k==='strict-transport-security'&&(+(v.match(/max-age=(\d+)/)||[])[1]||0)<15552000){s+=w*.5;out.push(R('warn',k+' max-age is under 6 months'));return}
s+=w;out.push(R('ok',k+' is set'))});
if(/\d/.test(m.server||''))out.push(R('warn','Server header reveals a version: '+m.server));
if(m['x-powered-by'])out.push(R('warn','X-Powered-By reveals the stack: '+m['x-powered-by']));
s=Math.round(s);const g=s>=90?'A':s>=75?'B':s>=60?'C':s>=40?'D':'F';return{s,g,c:s>=75?'ok':s>=40?'warn':'bad',html:out.join('')}}

const tools=[
{n:'Password strength',d:'Entropy score, weak patterns and offline crack time.',
h:`<label for="a">Password</label><input id="a" autocomplete="off" spellcheck="false"><div class="meter"><b id="m"></b></div><div id="o"></div>`,
i(r){const a=$('#a',r),m=$('#m',r),o=$('#o',r);const go=()=>{const p=a.value;if(!p){o.innerHTML='';m.style.width=0;return}const s=strength(p);m.style.width=Math.min(100,s.bits)+'%';m.className=s.c;
o.innerHTML=`<p class="big ${s.c}">${s.l}<small>${Math.round(s.bits)} bits, about ${TM(s.sec)} to crack offline</small></p>`+s.tips.map(x=>R(x[0],x[1])).join('')};a.oninput=go;return()=>{a.value='Summer2024!';go()}}},
{n:'Password generator',d:'Random passwords from your browser\'s secure generator.',
h:`<div class="two"><label for="l">Length: <span id="n">16</span></label><input id="l" type="range" min="8" max="64" value="16"></div><label class="ck"><input type="checkbox" checked> a-z</label><label class="ck"><input type="checkbox" checked> A-Z</label><label class="ck"><input type="checkbox" checked> 0-9</label><label class="ck"><input type="checkbox" checked> Symbols</label><div><button class="b" id="g">Generate</button></div><div id="o"></div>`,
i(r){const o=$('#o',r),l=$('#l',r),cs=r.querySelectorAll('[type=checkbox]');const go=()=>{$('#n',r).textContent=l.value;const sets=['abcdefghijkmnopqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789','!@#$%^&*-_=+?'];let pool=sets.filter((s,j)=>cs[j].checked).join('')||sets[0];
const pw=Array.from({length:+l.value},()=>pool[rnd(pool.length)]).join('');o.innerHTML=`<div class="kv"><code class="code" style="font-size:22px;letter-spacing:.02em">${esc(pw)}</code></div><button class="b" id="c">Copy</button>`+R('info','About '+Math.round(l.value*Math.log2(pool.length))+' bits of entropy');
$('#c',r).onclick=async e=>{try{await navigator.clipboard.writeText(pw)}catch{}e.target.textContent='Copied'}};
r.querySelectorAll('input').forEach(x=>x.oninput=go);$('#g',r).onclick=go;go();return go}},
{n:'Hash generator',d:'SHA-1, SHA-256, SHA-384 and SHA-512 of any text, with a match check.',
h:`<label for="a">Text</label><textarea id="a" rows="3"></textarea><label for="c">Compare with a known hash (optional)</label><input id="c" spellcheck="false"><div id="o"></div>`,
i(r){const a=$('#a',r),c=$('#c',r),o=$('#o',r);const go=async()=>{const d=enc.encode(a.value),rows=[];for(const al of['SHA-1','SHA-256','SHA-384','SHA-512'])rows.push([al,hex(await crypto.subtle.digest(al,d))]);
const cv=c.value.trim().toLowerCase();o.innerHTML=rows.map(([n,v])=>`<div class="kv"><span>${n}</span><code>${v}</code></div>`).join('')+(cv?(rows.some(x=>x[1]===cv)?R('ok','Hash matches, content is unchanged'):R('bad','No match with any algorithm')):'')};
a.oninput=c.oninput=go;go();return()=>{a.value='hello world';c.value='b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9';go()}}},
{n:'Phishing URL checker',d:'Flags lookalike brands, bad endings, tricks and pressure words.',
h:`<label for="a">Link to check</label><input id="a" spellcheck="false" placeholder="https://example.com/login"><div id="o"></div>`,
i(r){const a=$('#a',r),o=$('#o',r);const go=()=>{if(!a.value.trim()){o.innerHTML='';return}const x=phish(a.value.trim());o.innerHTML=`<p class="big ${x.c}">${x.v}</p>`+x.html};a.oninput=go;return()=>{a.value='http://secure-login.paytm.kyc-update.xyz/verify?otp=1';go()}}},
{n:'Encoder / decoder',d:'Base64, URL and hex, in both directions.',
h:`<div class="two"><label for="md">Mode</label><select id="md"><option>Base64 encode</option><option>Base64 decode</option><option>URL encode</option><option>URL decode</option><option>Hex encode</option><option>Hex decode</option></select></div><label for="a">Input</label><textarea id="a" rows="3"></textarea><label for="b">Output</label><textarea id="b" rows="3" readonly></textarea>`,
i(r){const a=$('#a',r),b=$('#b',r),md=$('#md',r);const go=()=>{const v=a.value;try{b.value=[()=>b64(enc.encode(v)),()=>dec.decode(unb64(v.trim())),()=>encodeURIComponent(v),()=>decodeURIComponent(v),()=>hex(enc.encode(v)),()=>dec.decode(Uint8Array.from(v.match(/../g)||[],h=>parseInt(h,16)))][md.selectedIndex]()}catch{b.value='Input is not valid for this mode'}};
a.oninput=md.onchange=go;return()=>{md.selectedIndex=0;a.value='Hello Render!';go()}}},
{n:'AES text encryption',d:'Encrypt and decrypt text with a passphrase (AES-256-GCM).',
h:`<label for="a">Text</label><textarea id="a" rows="3"></textarea><label for="p">Passphrase</label><input id="p" autocomplete="off"><div><button class="b" id="e">Encrypt</button><button class="b" id="d">Decrypt</button><button class="b" id="u">Use result as input</button></div><div id="o"></div>`,
i(r){const a=$('#a',r),p=$('#p',r),o=$('#o',r);let last='';
const kd=async(pw,s)=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const E=async()=>{if(!p.value){o.innerHTML=R('warn','Enter a passphrase');return}const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kd(p.value,s),enc.encode(a.value)));last=b64([...s,...iv,...ct]);o.innerHTML=R('ok','Encrypted with AES-256-GCM')+`<div class="kv"><code>${last}</code></div>`};
const D=async()=>{try{const x=unb64(a.value.trim());last=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:x.slice(16,28)},await kd(p.value,x.slice(0,16)),x.slice(28)));o.innerHTML=R('ok','Decrypted')+`<div class="kv"><code>${esc(last)}</code></div>`}catch{o.innerHTML=R('bad','Wrong passphrase or damaged text')}};
$('#e',r).onclick=E;$('#d',r).onclick=D;$('#u',r).onclick=()=>{a.value=last};
return async()=>{a.value='Meet at the station at 6 pm';p.value='demo-pass';await E();a.value=last;await sleep(1600);await D()}}},
{n:'JWT decoder',d:'Read a token\'s header and claims, and spot risky settings.',
h:`<label for="a">JWT</label><textarea id="a" rows="4" spellcheck="false"></textarea><div id="o"></div>`,
i(r){const a=$('#a',r),o=$('#o',r);const go=()=>{const t=a.value.trim();if(!t){o.innerHTML='';return}try{const[h,p]=t.split('.'),H=jd(h),P=jd(p),x=[];
if(String(H.alg).toLowerCase()==='none')x.push(R('bad','Algorithm is "none": the token is unsigned'));else x.push(R('info','Signed with '+H.alg));
if(P.exp){const d=new Date(P.exp*1000);x.push(P.exp*1000<Date.now()?R('bad','Expired on '+d.toLocaleString()):R('ok','Valid until '+d.toLocaleString()))}else x.push(R('warn','No expiry (exp) claim'));
x.push(R('info','This tool decodes only. It does not verify the signature.'));
o.innerHTML=`<div class="kv"><span>Header</span><pre style="margin:4px 0"><code>${esc(JSON.stringify(H,null,2))}</code></pre></div><div class="kv"><span>Payload</span><pre style="margin:4px 0"><code>${esc(JSON.stringify(P,null,2))}</code></pre></div>`+x.join('')}catch{o.innerHTML=R('bad','Not a valid JWT')}};
a.oninput=go;return()=>{a.value=ju({alg:'HS256',typ:'JWT'})+'.'+ju({sub:'1234',name:'Asha',role:'admin',exp:Math.floor(Date.now()/1000)+3600})+'.demo-signature';go()}}},
{n:'Email header analyzer',d:'Check SPF, DKIM, DMARC and spoofing signs in raw headers.',
h:`<label for="a">Paste the raw email headers</label><textarea id="a" rows="6" spellcheck="false"></textarea><div id="o"></div>`,
i(r){const a=$('#a',r),o=$('#o',r);const go=()=>{o.innerHTML=a.value.trim()?mail(a.value):''};a.oninput=go;
return()=>{a.value=`Return-Path: <refund@secure-pay-help.xyz>
Received: from mail.secure-pay-help.xyz (203.0.113.5) by mx.google.com with ESMTP
Received: from [10.0.0.2] by mail.secure-pay-help.xyz
Authentication-Results: mx.google.com; spf=fail smtp.mailfrom=secure-pay-help.xyz; dkim=none; dmarc=fail header.from=hdfcbank.com
From: "HDFC Bank" <alerts@hdfcbank.com>
Reply-To: <claims@gmail-support.top>
Subject: Urgent: KYC expired, verify now`;go()}}},
{n:'TOTP code generator',d:'Live 6-digit 2FA codes from a Base32 secret.',
h:`<label for="a">Base32 secret</label><input id="a" autocomplete="off" spellcheck="false"><div id="o"></div><p class="d">For learning only. Never paste a real account secret into any website.</p>`,
i(r){const a=$('#a',r),o=$('#o',r);const go=async()=>{try{const c=await totp(a.value),l=30-Math.floor(Date.now()/1000)%30;o.innerHTML=`<div class="kv"><code class="code">${c.slice(0,3)} ${c.slice(3)}</code></div><div class="meter"><b style="width:${l/30*100}%"></b></div>`+R('info','New code in '+l+' seconds')}catch{o.innerHTML=R('warn','Enter a valid Base32 secret (letters A-Z, digits 2-7)')}};
a.oninput=go;timer=setInterval(go,1000);return()=>{a.value='JBSWY3DPEHPK3PXP';go()}}},
{n:'Security headers grader',d:'Paste a site\'s response headers and get a grade.',
h:`<label for="a">Response headers</label><textarea id="a" rows="6" spellcheck="false"></textarea><div id="o"></div>`,
i(r){const a=$('#a',r),o=$('#o',r);const go=()=>{if(!a.value.trim()){o.innerHTML='';return}const x=heads(a.value);o.innerHTML=`<p class="big ${x.c}">Grade ${x.g}<small>${x.s} / 100</small></p>`+x.html};a.oninput=go;
return()=>{a.value=`Content-Type: text/html
Server: nginx/1.18.0
X-Powered-By: Express
Strict-Transport-Security: max-age=31536000; includeSubDomains
X-Content-Type-Options: nosniff
Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'`;go()}}}
];

function openTool(k){clearInterval(timer);document.querySelectorAll('.nv').forEach((b,j)=>b.classList.toggle('on',j===k));const t=tools[k];
$('#main').innerHTML=`<div class="top"><h2>${t.n}</h2><button class="b" id="smp" style="margin:0">Load sample</button></div><p class="d">${t.d}</p><div id="tool">${t.h}</div>`;
const s=t.i($('#tool'));$('#smp').onclick=s;return s}
tools.forEach((t,k)=>{const b=document.createElement('button');b.className='nv';b.innerHTML=`<b>${t.n}</b><small>${t.d.split(/[.,]/)[0]}</small>`;b.onclick=()=>{demoOn=false;$('#demo').textContent='Run demo';openTool(k)};$('#nav').appendChild(b)});
$('#demo').onclick=async()=>{const bt=$('#demo');if(demoOn){demoOn=false;bt.textContent='Run demo';return}demoOn=true;bt.textContent='Stop demo';
for(let k=0;k<tools.length&&demoOn;k++){const s=openTool(k);await sleep(500);if(!demoOn)break;await s();await sleep(3500)}demoOn=false;bt.textContent='Run demo'};
openTool(0)();
